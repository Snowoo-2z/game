<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
  #c{
    display:block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background:#87CEEB;
  }
  .touch{
    display:none;
    position:fixed;
    inset:0;
    pointer-events:none;
  }
  .touch div{
    position:absolute;
    bottom:0;
    top:40%;
    pointer-events:auto;
  }
  #tLeft{left:0; width:28%;}
  #tRight{right:0; width:28%;}
  #tJump{left:28%; right:28%;}
  @media(pointer:coarse){
    .touch{display:block}
  }
  #hud{
    position:fixed;
    top:14px;
    right:14px;
    background:rgba(0,0,0,0.65);
    border:2px solid #fff;
    color:#FFE600;
    font-family: monospace;
    font-weight:900;
    font-size:18px;
    letter-spacing:1px;
    padding:8px 14px;
    image-rendering: pixelated;
    pointer-events:none;
    z-index:10;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
  }
  #rouletteOverlay{
    position:fixed; inset:0;
    background:rgba(10,8,20,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:50;
    font-family: monospace;
  }
  #rouletteOverlay h2{
    color:#FFE600; font-size:22px; letter-spacing:2px; text-shadow:3px 3px 0 #000;
    margin-bottom:10px;
  }
  #rouletteOverlay p{color:#fff; font-size:14px; margin-bottom:14px; opacity:0.9}
  .wheelWrap{position:relative; width:300px; height:300px; display:flex; align-items:center; justify-content:center}
  #wheel{
    width:280px; height:280px; border-radius:50%;
    border:6px solid #fff;
    box-shadow: 0 0 0 6px #1A102E, 0 12px 30px rgba(0,0,0,0.5);
    position:relative; overflow:hidden;
    transition: transform 4s cubic-bezier(0.17,0.67,0.12,0.99);
  }
  #wheel canvas{width:100%; height:100%; display:block; border-radius:50%}
  .pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent; border-top:22px solid #FF1B5A;
    filter: drop-shadow(0 2px 0 #000);
    z-index:2;
  }
  .centerDot{
    position:absolute; width:44px; height:44px; background:#fff; border:4px solid #1A102E; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:900; color:#1A102E; font-size:14px;
    z-index:3; pointer-events:none;
  }
  #spinBtn{
    margin-top:18px;
    background:#FFE600; color:#1A102E; border:3px solid #1A102E; border-bottom:6px solid #1A102E;
    padding:12px 28px; font-weight:900; font-size:16px; letter-spacing:2px; cursor:pointer;
    box-shadow:4px 4px 0 rgba(0,0,0,0.4);
  }
  #spinBtn:active{transform:translateY(3px); border-bottom:3px solid #1A102E}
  #spinBtn:disabled{opacity:0.5; cursor:not-allowed}
  #winText{color:#2ECC71; font-weight:900; font-size:18px; margin-top:12px; min-height:22px; text-shadow:2px 2px 0 #000}

const keys = {};
addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.code==='KeyR') reset();
});
addEventListener('keyup', e=> keys[e.code]=false);
function isDown(...codes){ return codes.some(c=>keys[c]); }

['tLeft','tRight','tJump'].forEach(id=>{
  const el=document.getElementById(id);
  if(!el) return;
  const set = (v)=>{
    if(id==='tLeft') keys['ArrowLeft']=v;
    if(id==='tRight') keys['ArrowRight']=v;
    if(id==='tJump') keys['Space']=v;
  };
  el.addEventListener('touchstart', e=>{ e.preventDefault(); set(true); }, {passive:false});
  el.addEventListener('touchend', e=>{ e.preventDefault(); set(false); }, {passive:false});
  el.addEventListener('touchcancel', e=>{ e.preventDefault(); set(false); }, {passive:false});
});

const particles=[];
function spawnParticles(x,y, count, opts={}){
  for(let i=0;i<count;i++){
    particles.push({
      x:x + (Math.random()-0.5)*6,
      y:y,
      vx:(Math.random()-0.5)* (opts.spreadX||6),
      vy: (opts.vy|| -3) + (Math.random()-0.5)*2,
      life:1,
      decay: 0.04 + Math.random()*0.06,
      size: 2+Math.random()*4,
      color: opts.color || (Math.random()<0.5? '#fff' : '#FFE600'),
      gravity: opts.gravity ?? 0.25,
      type: opts.type || 'square'
    });
  }
}
function spawnDust(x,y){
  for(let i=0;i<10;i++){
    particles.push({
      x:x + (Math.random()-0.5)*20,
      y:y,
      vx:(Math.random()-0.5)*5,
      vy:-Math.random()*3 -1,
      life:1, decay:0.08, size:2+Math.random()*3,
      color: i%2? '#C47A3A':'#fff', gravity:0.3, type:'square'
    });
  }
}
function spawnDoubleJumpRing(x,y){
  for(let i=0;i<12;i++){
    const a = (i/12)*Math.PI*2;
    particles.push({
      x:x, y:y,
      vx: Math.cos(a)*4, vy: Math.sin(a)*4,
      life:1, decay:0.07, size:3, color:'#7AB0FF', gravity:0, type:'circle'
    });
  }
  spawnParticles(x,y,8,{spreadX:8, vy:-2, color:'#FFE600', gravity:0.15})
}

function checkCollision(px,py,pw,ph, plat){
  return px < plat.x+plat.w && px+pw > plat.x && py < plat.y+plat.h && py+ph > plat.y;
}

function drawGroundTile(x,y,w,h){
  ctx.fillStyle=PAL.dirt;
  ctx.fillRect(x,y,w,h);
  ctx.fillStyle=PAL.dirtDark;
  for(let i=0;i<w;i+=16){
    ctx.fillRect(x+i+6, y+8, 4, h-8);
    ctx.fillRect(x+i+12, y+12, 2, 6);
  }
  ctx.fillStyle=PAL.dirtLight;
  for(let i=0;i<12;i++){
    const px = x + (i*73 % w);
    const py = y + 18 + (i*37 % (h-20));
    ctx.fillRect(px,py,2,2);
  }
  ctx.fillStyle=PAL.grassDark;
  ctx.fillRect(x,y, w, 10);
  ctx.fillStyle=PAL.grass;
  ctx.fillRect(x,y, w, 7);
  ctx.fillStyle=PAL.grassLight;
  ctx.fillRect(x,y, w, 2);
  ctx.fillStyle=PAL.grassDark;
  for(let i=0;i<w;i+=12){
    ctx.fillRect(x+i+2, y+7, 2,3);
    ctx.fillRect(x+i+8, y+7, 2,4);
  }
  ctx.fillStyle=PAL.outline;
  ctx.fillRect(x,y,w,1);
}
function drawFloatPlatform(p){
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(p.x+4, p.y+4, p.w, p.h);
  ctx.fillStyle=PAL.dirt;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle=PAL.dirtLight;
  ctx.fillRect(p.x, p.y, p.w, 3);
  ctx.fillStyle=PAL.grass;
  ctx.fillRect(p.x, p.y, p.w, 6);
  ctx.fillStyle=PAL.grassDark;
  ctx.fillRect(p.x, p.y+p.h-3, p.w, 3);
  ctx.fillStyle=PAL.outline;
  ctx.fillRect(p.x, p.y, p.w, 1);
  ctx.fillRect(p.x, p.y+p.h-1, p.w, 1);
  ctx.fillRect(p.x, p.y, 1, p.h);
  ctx.fillRect(p.x+p.w-1, p.y, 1, p.h);
  ctx.fillStyle=PAL.grassLight;
  ctx.fillRect(p.x+4, p.y, 6,2);

}

function drawCharacter(x,y, dir, state, frame, squish){
  const grid = getSpriteGrid(state, frame);
  const pxSize = 2;
  const totalW = 16*pxSize;
  const totalH = 20*pxSize;
  // bobbing naturel
  let bob = 0;
  if(state==='idle') bob = Math.sin(frame*0.12)*1.2;
  else if(state==='run') bob = Math.abs(Math.sin(frame*0.9))*2.5;
  else if(state==='crouch') bob = 2;
  const ox = x + (player.w - totalW)/2;
  const oy = y + (player.h - totalH) -2 + squish*4 + bob;
  ctx.save();
  const pivotX = x + player.w/2;
  const pivotY = y + player.h;
  // squash/stretch autour des pieds
  ctx.translate(pivotX, pivotY);
  ctx.scale(1 + squish*0.3, 1 - squish*0.4);
  ctx.translate(-pivotX, -pivotY);
  // flip horizontal propre autour du centre du joueur
  if(dir===1){
    ctx.translate(pivotX, 0);
    ctx.scale(-1, 1);
    ctx.translate(-pivotX, 0);
  }
  drawGrid(ox, oy, grid, pxSize);
  ctx.restore();
}
function drawGrid(ox, oy, grid, s){
  const colorMap = {
    '1': PAL.outline,
    '2': PAL.skin,
    '3': PAL.skinShade,
    '4': PAL.hair,
    '5': PAL.cap,
    '6': PAL.capDark,
    '7': PAL.capLight,
    '8': PAL.shirt,
    '9': PAL.shirtDark,
    'A': PAL.pants,
    'B': PAL.shoe,
    'C': PAL.shoeSole,
    'F': PAL.white,
  };
  for(let row=0; row<grid.length; row++){
    const line = grid[row];
    for(let col=0; col<line.length; col++){
      const ch = line[col];
      if(ch===' ' || ch==='0') continue;
      const colr = colorMap[ch];
      if(!colr) continue;
      ctx.fillStyle=colr;
      ctx.fillRect(Math.round(ox+col*s), Math.round(oy+row*s), s, s);
    }
  }
}
function _unused_drawCoin(c){
  if(c.taken) return;
  const bob = Math.sin(globalTime*0.004 + c.x)*4;
  const x = c.x, y = c.y + bob;
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(x+8, y+20, 10, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFD700';
  ctx.fillRect(x,y,16,16);
  ctx.fillStyle='#FFA500';
  ctx.fillRect(x,y+12,16,4);
  ctx.fillRect(x+12,y,4,16);
  ctx.fillStyle='#FFF7AA';
  ctx.fillRect(x+2,y+2,4,4);
  ctx.fillRect(x+10,y+6,2,6);
  ctx.fillStyle=PAL.outline;
  ctx.fillRect(x,y,16,1);
  ctx.fillRect(x,y+15,16,1);
  ctx.fillRect(x,y,1,16);
  ctx.fillRect(x+15,y,1,16);
  ctx.fillStyle='#fff';
  ctx.fillRect(x+4,y+4,2,2);
}

let wasOnGround=false;
function update(){
  globalTime+=16;
  const left = isDown('ArrowLeft','KeyA');
  const right = isDown('ArrowRight','KeyD');
  const jumpPressed = isDown('Space','ArrowUp','KeyW');
  let input = 0;
  if(left) input -=1;
  if(right) input +=1;
  if(input!==0) player.dir = input;
  if(input!==0){
    player.vx += input * ACCEL * 1.2;
    if(Math.abs(player.vx) > SPEED) player.vx = Math.sign(player.vx)*SPEED;
  } else {
    player.vx *= FRICTION;
    if(Math.abs(player.vx)<0.1) player.vx=0;
  }
  if(jumpPressed) player.jumpBuffer=6; else if(player.jumpBuffer>0) player.jumpBuffer--;
  if(player.onGround) {player.coyote=6; player.jumps=2; } else if(player.coyote>0) player.coyote--;
  const justPressed = jumpPressed && !player.wasSpace;
  if(justPressed && (player.coyote>0 || player.jumpBuffer>0 || player.jumps>0)){
    const isDouble = !player.onGround && player.coyote===0;
    if(isDouble){
      if(player.jumps>0){
        player.vy = DOUBLE_JUMP_VEL;
        player.jumps--;
        player.coyote=0;
        player.jumpBuffer=0;
        player.squish = -0.8;
        cameraShake=6;
        spawnDoubleJumpRing(player.x+player.w/2, player.y+player.h/2);
        spawnParticles(player.x+player.w/2, player.y+player.h, 6, {color:'#7AB0FF', gravity:0.1})
      }
    } else {
      player.vy = JUMP_VEL;
      player.coyote=0;
      player.jumpBuffer=0;
      player.jumps=1;
      player.squish = -0.9;
      spawnDust(player.x+player.w/2, player.y+player.h);
      if(player.onGround) player.jumps=1;
    }
    player.onGround=false;
  }
  if(!jumpPressed && player.vy < -4) player.vy *= 0.88;
  player.wasSpace = jumpPressed;
  player.vy += GRAVITY;
  if(player.vy>14) player.vy=14;
  let nextX = player.x + player.vx;
  for(const p of platforms){
    if(checkCollision(nextX, player.y, player.w, player.h, p)){
      if(player.vx>0) nextX = p.x - player.w;
      else if(player.vx<0) nextX = p.x + p.w;
      player.vx=0;
    }
  }
  player.x = nextX;
  let nextY = player.y + player.vy;
  player.onGround=false;
  for(const p of platforms){
    if(checkCollision(player.x, nextY, player.w, player.h, p)){
      if(player.vy>0){
        nextY = p.y - player.h;
        if(!wasOnGround){
          if(player.vy>6){
            cameraShake = Math.min(10, player.vy);
            spawnDust(player.x+player.w/2, nextY+player.h);
            spawnParticles(player.x+player.w/2, nextY+player.h, 4, {color:'#C47A3A'});
            player.squish=0.9;
            player.landTimer=10;
          } else if(player.vy>2){
            spawnDust(player.x+player.w/2, nextY+player.h);
            player.squish=0.5;
            player.landTimer=6;
          }
        }
        player.vy=0;
        player.onGround=true;
        player.jumps=2;
      } else if(player.vy<0){
        nextY = p.y + p.h;
        player.vy=0;
      }
    }
  }
  player.y = nextY;
  if(player.x<0){player.x=0; player.vx=0;}
  if(player.x+player.w>W){player.x=W-player.w; player.vx=0;}
  if(player.y > H+80){
    player.y=100; player.x=60; player.vy=0; player.vx=0;
    cameraShake=12;
    spawnParticles(player.x+player.w/2, player.y+player.h, 16, {color:'#FF1B5A', spreadX:10, vy:-4})
  }
  wasOnGround = player.onGround;
  if(player.landTimer>0) player.landTimer--;
  // skid quand on change de direction vite
  if(player.onGround && Math.abs(player.vx)>3 && Math.sign(input)!==0 && Math.sign(input)!==Math.sign(player.vx)){
    player.skidTimer=6;
    if(Math.random()<0.3) spawnDust(player.x+player.w/2, player.y+player.h);
  }
  if(player.skidTimer>0) player.skidTimer--;
  player.squish *= 0.82;
  if(Math.abs(player.squish)<0.01) player.squish=0;
  // anim
  if(!player.onGround) player.animT+=0.9;
  else if(Math.abs(player.vx)>0.5) player.animT+=0.65;
  else player.animT+=0.35;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=p.gravity;
    p.vx*=0.98;
    p.life-=p.decay;
    if(p.life<=0) particles.splice(i,1);
  }
  if(cameraShake>0) cameraShake*=0.85;
  if(cameraShake<0.1) cameraShake=0;
}

function render(){
  ctx.save();
  if(cameraShake>0) ctx.translate((Math.random()-0.5)*cameraShake, (Math.random()-0.5)*cameraShake);
  ctx.fillStyle=PAL.sky;
  ctx.fillRect(0,0,W,H);
  for(const p of platforms){
    if(p.type==='ground') drawGroundTile(p.x,p.y,p.w,p.h);
    else drawFloatPlatform(p);
  }
  let state='idle', frame=Math.floor(player.animT);
  if(!player.onGround){
    state = player.vy<0 ? 'jump' : 'fall';
    frame = Math.floor(player.animT);
  } else {
    if(player.landTimer>0){
      state='crouch';
      frame = Math.floor(player.animT);
    } else if(Math.abs(player.vx)>0.5){
      state='run';
      frame = Math.floor(player.animT / 5.2);
    } else {
      state='idle';
      frame = Math.floor(player.animT);
    }
  }
  if(Math.abs(player.vx)>3 || !player.onGround){
    ctx.globalAlpha=0.15;
    drawCharacter(player.x - player.vx*1.5, player.y - player.vy*0.5, player.dir, state, frame, player.squish);
    ctx.globalAlpha=1;
  }
  ctx.fillStyle='rgba(0,0,0,0.18)';
  let groundY = 480;
  for(const p of platforms){
    if(player.x+player.w/2 > p.x && player.x+player.w/2 < p.x+p.w && p.y > player.y){
      if(p.y < groundY) groundY=p.y;
    }
  }
  const dist = groundY - (player.y+player.h);
  const shadowScale = Math.max(0, 1 - dist/120);
  ctx.beginPath();
  ctx.ellipse(player.x+player.w/2, groundY+2, 14*shadowScale+4, 4*shadowScale+2, 0,0,Math.PI*2);
  ctx.fill();
  drawCharacter(player.x, player.y, player.dir, state, frame, player.squish);
  for(const p of particles){
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle=p.color;
    if(p.type==='circle'){
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillRect(p.x,p.y,p.size,p.size);
    }
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function loop(){
  if(!rouletteDone) { render(); requestAnimationFrame(loop); return; }
  update();
  render();
  requestAnimationFrame(loop);
}
// --- ROULETTE ---
let rouletteDone = false;
let isSpinning = false;
const segments = [100, 250, 400, 550, 700, 850, 900, 1000];
const segColors = ['#FF1B5A','#3A86FF','#2ECC71','#FFE600','#FF8C00','#9B59B6','#1ABC9C','#E74C3C'];
const wheelEl = document.getElementById('wheel');
const wheelCanvas = document.getElementById('wheelCanvas');
const wctx = wheelCanvas.getContext('2d');
const spinBtn = document.getElementById('spinBtn');
const winText = document.getElementById('winText');
const overlay = document.getElementById('rouletteOverlay');
let currentRotation = 0;

function drawRoulette(){
  const cx=140, cy=140, r=140;
  const n=segments.length;
  wctx.clearRect(0,0,280,280);
  for(let i=0;i<n;i++){
    const start = (i/n)*Math.PI*2 - Math.PI/2;
    const end = ((i+1)/n)*Math.PI*2 - Math.PI/2;
    wctx.beginPath();
    wctx.moveTo(cx,cy);
    wctx.arc(cx,cy,r,start,end);
    wctx.closePath();
    wctx.fillStyle=segColors[i];
    wctx.fill();
    wctx.strokeStyle='#1A102E';
    wctx.lineWidth=3;
    wctx.stroke();
    // texte
    wctx.save();
    wctx.translate(cx,cy);
    const mid = (start+end)/2;
    wctx.rotate(mid + Math.PI/2);
    wctx.textAlign='center';
    wctx.fillStyle='#fff';
    wctx.font='900 14px monospace';
    wctx.strokeStyle='#1A102E';
    wctx.lineWidth=3;
    const txt = segments[i]+'$';
    wctx.strokeText(txt, 0, -95);
    wctx.fillText(txt, 0, -95);
    wctx.restore();
  }
  // center circle
  wctx.beginPath();
  wctx.arc(cx,cy,26,0,Math.PI*2);
  wctx.fillStyle='#fff';
  wctx.fill();
  wctx.strokeStyle='#1A102E';
  wctx.lineWidth=4;
  wctx.stroke();
}
drawRoulette();

function spinRoulette(){
  if(isSpinning) return;
  isSpinning=true;
  spinBtn.disabled=true;
  winText.textContent='';
  winText.style.color='#fff';
  winText.textContent='...';
  // tirage 100-1000 (on mappe sur un segment pour l'affichage)
  const spins = 5 + Math.random()*3; // 5-8 tours
  const randomSeg = Math.floor(Math.random()*segments.length);
  const segAngle = 360/segments.length;
  // on veut que le segment choisi finisse en haut (pointeur à 0°)
  // la roue tourne dans le sens horaire, le pointeur est en haut (-90deg offset)
  // angle final = tours*360 + (360 - randomSeg*segAngle - segAngle/2)
  const target = spins*360 + (360 - randomSeg*segAngle - segAngle/2) + (Math.random()*segAngle*0.6 - segAngle*0.3);
  currentRotation += target;
  wheelEl.style.transform = `rotate(${currentRotation}deg)`;
  setTimeout(()=>{
    const win = segments[randomSeg];
    // petite variation pour vraiment 100-1000 si on veut un peu de random intra-segment
    // mais on garde la valeur du segment pour rester lisible
    player.money += win;
    updateHUD();
    winText.style.color='#2ECC71';
    winText.textContent = `+${win}$ !`;
    // confetti
    for(let i=0;i<30;i++){
      particles.push({
        x: W/2 + (Math.random()-0.5)*200,
        y: H/2 -80,
        vx:(Math.random()-0.5)*8,
        vy:-Math.random()*6 -2,
        life:1, decay:0.03+Math.random()*0.04, size:3+Math.random()*4,
        color: segColors[Math.floor(Math.random()*segColors.length)],
        gravity:0.3, type: Math.random()<0.5?'square':'circle'
      });
    }
    setTimeout(()=>{
      winText.textContent = `Tu commences avec ${player.money}$ !`;
      spinBtn.textContent = 'JOUER ▶';
      spinBtn.disabled=false;
      isSpinning=false;
      spinBtn.onclick = ()=>{
        overlay.style.transition='opacity 0.4s';
        overlay.style.opacity='0';
        setTimeout(()=>{ overlay.style.display='none'; rouletteDone=true; },400);
      };
    },900);
  },4200);
}
spinBtn.onclick = spinRoulette;

loop();
</script>
