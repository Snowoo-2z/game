<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
  #c{
    display:block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background:#87CEEB;
  }
  .touch{
    display:none;
    position:fixed;
    inset:0;
    pointer-events:none;
  }
  .touch div{
    position:absolute;
    bottom:0;
    top:40%;
    pointer-events:auto;
  }
  #tLeft{left:0; width:28%;}
  #tRight{right:0; width:28%;}
  #tJump{left:28%; right:28%;}
  @media(pointer:coarse){
    .touch{display:block}
  }
  #hud{
    position:fixed;
    top:14px;
    right:14px;
    background:rgba(0,0,0,0.65);
    border:2px solid #fff;
    color:#FFE600;
    font-family: monospace;
    font-weight:900;
    font-size:18px;
    letter-spacing:1px;
    padding:8px 14px;
    image-rendering: pixelated;
    pointer-events:none;
    z-index:10;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
  }
  #rouletteOverlay{
    position:fixed; inset:0;
    background:rgba(10,8,20,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:50;
    font-family: monospace;
  }
  #rouletteOverlay h2{
    color:#FFE600; font-size:22px; letter-spacing:2px; text-shadow:3px 3px 0 #000;
    margin-bottom:10px;
  }
  #rouletteOverlay p{color:#fff; font-size:14px; margin-bottom:14px; opacity:0.9}
  .wheelWrap{position:relative; width:300px; height:300px; display:flex; align-items:center; justify-content:center}
  #wheel{
    width:280px; height:280px; border-radius:50%;
    border:6px solid #fff;
    box-shadow: 0 0 0 6px #1A102E, 0 12px 30px rgba(0,0,0,0.5);
    position:relative; overflow:hidden;
    transition: transform 4s cubic-bezier(0.17,0.67,0.12,0.99);
  }
  #wheel canvas{width:100%; height:100%; display:block; border-radius:50%}
  .pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent; border-top:22px solid #FF1B5A;
    filter: drop-shadow(0 2px 0 #000);
    z-index:2;
  }
  .centerDot{
    position:absolute; width:44px; height:44px; background:#fff; border:4px solid #1A102E; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:900; color:#1A102E; font-size:14px;
    z-index:3; pointer-events:none;
  }
  #spinBtn{
    margin-top:18px;
    background:#FFE600; color:#1A102E; border:3px solid #1A102E; border-bottom:6px solid #1A102E;
    padding:12px 28px; font-weight:900; font-size:16px; letter-spacing:2px; cursor:pointer;
    box-shadow:4px 4px 0 rgba(0,0,0,0.4);
  }
  #spinBtn:active{transform:translateY(3px); border-bottom:3px solid #1A102E}
  #spinBtn:disabled{opacity:0.5; cursor:not-allowed}
  #winText{color:#2ECC71; font-weight:900; font-size:18px; margin-top:12px; min-height:22px; text-shadow:2px 2px 0 #000}
</style>
</head>

const keys = {};
addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.code==='KeyR') reset();
});
addEventListener('keyup', e=> keys[e.code]=false);
function isDown(...codes){ return codes.some(c=>keys[c]); }

['tLeft','tRight','tJump'].forEach(id=>{
  const el=document.getElementById(id);
  if(!el) return;
  const set = (v)=>{
    if(id==='tLeft') keys['ArrowLeft']=v;
    if(id==='tRight') keys['ArrowRight']=v;
    if(id==='tJump') keys['Space']=v;
  };
  el.addEventListener('touchstart', e=>{ e.preventDefault(); set(true); }, {passive:false});
  el.addEventListener('touchend', e=>{ e.preventDefault(); set(false); }, {passive:false});
  el.addEventListener('touchcancel', e=>{ e.preventDefault(); set(false); }, {passive:false});
});

const particles=[];
function spawnParticles(x,y, count, opts={}){
  for(let i=0;i<count;i++){
    particles.push({
      x:x + (Math.random()-0.5)*6,
      y:y,
      vx:(Math.random()-0.5)* (opts.spreadX||6),
      vy: (opts.vy|| -3) + (Math.random()-0.5)*2,
      life:1,
      decay: 0.04 + Math.random()*0.06,
      size: 2+Math.random()*4,
      color: opts.color || (Math.random()<0.5? '#fff' : '#FFE600'),
      gravity: opts.gravity ?? 0.25,
      type: opts.type || 'square'
    });
  }
}
function spawnDust(x,y){
  for(let i=0;i<10;i++){
    particles.push({
      x:x + (Math.random()-0.5)*20,
      y:y,
      vx:(Math.random()-0.5)*5,
      vy:-Math.random()*3 -1,
      life:1, decay:0.08, size:2+Math.random()*3,
      color: i%2? '#C47A3A':'#fff', gravity:0.3, type:'square'
    });
  }
}
function spawnDoubleJumpRing(x,y){
  for(let i=0;i<12;i++){
    const a = (i/12)*Math.PI*2;
    particles.push({
      x:x, y:y,
      vx: Math.cos(a)*4, vy: Math.sin(a)*4,
      life:1, decay:0.07, size:3, color:'#7AB0FF', gravity:0, type:'circle'
    });
  }
  spawnParticles(x,y,8,{spreadX:8, vy:-2, color:'#FFE600', gravity:0.15})
}

function getGroundHeight(wx){
  // terrain vallonné doux
  return 480 + Math.sin(wx*0.008)*14 + Math.sin(wx*0.018)*7 + Math.sin(wx*0.004)*10;

function reset(){
  player.x=60; player.y=getGroundHeight(60+14)-player.h; player.vx=0; player.vy=0; player.money=0; player.jumps=2;

function checkCollision(px,py,pw,ph, plat){
  return px < plat.x+plat.w && px+pw > plat.x && py < plat.y+plat.h && py+ph > plat.y;
}

function drawGroundTile(x,y,w,h){
  ctx.fillStyle=PAL.dirt;
  ctx.fillRect(x,y,w,h);
  ctx.fillStyle=PAL.dirtDark;
  for(let i=0;i<w;i+=16){
    ctx.fillRect(x+i+6, y+8, 4, h-8);
    ctx.fillRect(x+i+12, y+12, 2, 6);
  }
  ctx.fillStyle=PAL.dirtLight;
  for(let i=0;i<12;i++){
    const px = x + (i*73 % w);
    const py = y + 18 + (i*37 % (h-20));
    ctx.fillRect(px,py,2,2);
  }
  ctx.fillStyle=PAL.grassDark;
  ctx.fillRect(x,y, w, 10);
  ctx.fillStyle=PAL.grass;
  ctx.fillRect(x,y, w, 7);
  ctx.fillStyle=PAL.grassLight;
  ctx.fillRect(x,y, w, 2);
  ctx.fillStyle=PAL.grassDark;
  for(let i=0;i<w;i+=12){
    ctx.fillRect(x+i+2, y+7, 2,3);
    ctx.fillRect(x+i+8, y+7, 2,4);
  }
  ctx.fillStyle=PAL.outline;
  ctx.fillRect(x,y,w,1);
}
function drawFloatPlatform(p){
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(p.x+4, p.y+4, p.w, p.h);
  ctx.fillStyle=PAL.dirt;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle=PAL.dirtLight;
  ctx.fillRect(p.x, p.y, p.w, 3);
  ctx.fillStyle=PAL.grass;
  ctx.fillRect(p.x, p.y, p.w, 6);
  ctx.fillStyle=PAL.grassDark;
  ctx.fillRect(p.x, p.y+p.h-3, p.w, 3);
  ctx.fillStyle=PAL.outline;
  ctx.fillRect(p.x, p.y, p.w, 1);
  ctx.fillRect(p.x, p.y+p.h-1, p.w, 1);
  ctx.fillRect(p.x, p.y, 1, p.h);
  ctx.fillRect(p.x+p.w-1, p.y, 1, p.h);
  ctx.fillStyle=PAL.grassLight;
  ctx.fillRect(p.x+4, p.y, 6,2);
  ctx.fillRect(p.x+p.w-10, p.y, 6,2);
}
function pseudoRandom(n){ return ((Math.sin(n*127.1)*43758.5453)%1+1)%1; }
function drawScrollingGround(cam){
  const step=4;
  const startX = Math.floor(cam/step)*step - step*2;
  const endX = cam + W + step*4;
  // --- base polygon sol ---
  ctx.fillStyle=PAL.dirt;
  ctx.beginPath();
  ctx.moveTo(startX - cam, getGroundHeight(startX) - cam*0 + H); // dummy
  // Actually draw polygon from left to right along ground top then down to bottom
  for(let wx=startX; wx<=endX; wx+=step){
    const gy = getGroundHeight(wx);
    const sx = wx - cam;
    if(wx===startX) ctx.moveTo(sx, gy);
    else ctx.lineTo(sx, gy);
  }
  // close to bottom
  ctx.lineTo(endX - cam, H);
  ctx.lineTo(startX - cam, H);
  ctx.closePath();
  ctx.fill();

  // --- texture dirt: bandes sombres verticales ---
  ctx.fillStyle=PAL.dirtDark;
  for(let wx=startX; wx<endX; wx+=32){
    const gy = getGroundHeight(wx+16);
    const sx = wx - cam;
    const h = H - gy;
    // petites veines
    ctx.fillRect(sx+8, gy+10, 3, Math.min(h-12, 24));
    if(pseudoRandom(wx)>0.5) ctx.fillRect(sx+18, gy+18, 2, 14);
  }
  // mouchetis clair
  ctx.fillStyle=PAL.dirtLight;
  for(let wx=startX; wx<endX; wx+=48){
    const gy = getGroundHeight(wx);
    const sx = wx - cam;
    const r = pseudoRandom(wx*1.3);
    if(r>0.4){
      ctx.fillRect(sx+12, gy+14, 2,2);
      if(r>0.7) ctx.fillRect(sx+6, gy+22, 2,2);
    }
  }
  // --- strate horizontale sous-sol ---
  ctx.fillStyle='#9E5A26';
  ctx.beginPath();
  for(let wx=startX; wx<=endX; wx+=step){
    const gy = getGroundHeight(wx)+18;
    const sx = wx - cam;
    if(wx===startX) ctx.moveTo(sx, gy);
    else ctx.lineTo(sx, gy);
  }
  ctx.lineTo(endX - cam, H);
  ctx.lineTo(startX - cam, H);
  ctx.closePath();
  ctx.fill();
  // pierres enterrées
  ctx.fillStyle='#7A3D16';
  for(let wx=startX; wx<endX; wx+=64){
    if(pseudoRandom(wx*2.1)<0.45){
      const gy = getGroundHeight(wx)+22 + pseudoRandom(wx+5)*10;
      const sx = wx - cam;
      ctx.fillRect(sx+10, gy, 6,4);
      ctx.fillRect(sx+12, gy+4, 4,2);
    }
  }

  // --- herbe épaisse sur le dessus ---
  // contour herbe foncée (outline)
  ctx.strokeStyle=PAL.outline;
  ctx.lineWidth=2;
  ctx.beginPath();
  for(let wx=startX; wx<=endX; wx+=step){
    const gy = getGroundHeight(wx);
    const sx = wx - cam;
    if(wx===startX) ctx.moveTo(sx, gy);
    else ctx.lineTo(sx, gy);
  }
  ctx.stroke();
  // bande herbe 10px
  // on dessine par segment pour épaisseur
  for(let wx=startX; wx<endX; wx+=step){
    const gy = getGroundHeight(wx);
    const sx = wx - cam;
    // herbe sombre base
    ctx.fillStyle=PAL.grassDark;
    ctx.fillRect(sx, gy, step+1, 10);
    ctx.fillStyle=PAL.grass;
    ctx.fillRect(sx, gy, step+1, 7);
    ctx.fillStyle=PAL.grassLight;
    ctx.fillRect(sx, gy, step+1, 2);
  }
  // brins d'herbe pixel
  ctx.fillStyle=PAL.grassDark;
  for(let wx=startX; wx<endX; wx+=12){
    const gy = getGroundHeight(wx);
    const sx = wx - cam;
    if(pseudoRandom(wx)>0.35){
      ctx.fillRect(sx+3, gy-3, 2,4);
      if(pseudoRandom(wx+1)>0.6) ctx.fillRect(sx+7, gy-4, 2,5);
    }
  }
  // petites fleurs / touffes décor
  for(let wx=startX; wx<endX; wx+=90){
    const r = pseudoRandom(wx*0.7);
    const gy = getGroundHeight(wx+20);
    const sx = wx+20 - cam;
    if(r<0.22){
      // petite fleur jaune
      ctx.fillStyle='#FFE600';
      ctx.fillRect(sx, gy-6, 3,3);
      ctx.fillStyle='#fff';
      ctx.fillRect(sx+1, gy-7, 1,1);
      ctx.fillStyle=PAL.grassDark;
      ctx.fillRect(sx+1, gy-3, 1,3);
    } else if(r<0.32){
      // caillou
      ctx.fillStyle='#B0A090';
      ctx.fillRect(sx, gy-3, 5,3);
      ctx.fillStyle='#8A7A6A';
      ctx.fillRect(sx, gy-1, 5,1);
    } else if(r<0.45){
      // petite touffe buisson
      ctx.fillStyle='#2ECC71';
      ctx.fillRect(sx, gy-5, 6,4);
      ctx.fillStyle='#1E9E55';
      ctx.fillRect(sx+2, gy-3, 2,2);
    }
  }
}

  const jump = [
    "    111111      ",
    "   15555551     ",
    "  1557775551    ",
    "  15FFF55551    ",
    "  1522275551    ",
    "   12222751     ",
    "   12222751     ",
    " 11118888111    ",
    " 188899988811   ",
    " 188888888811   ",
    "  188888881     ",
    "   18888881     ",
    "   1AAAAA81     ",
    "   1AAAAAA1     ",
    "   1AAAAAA1     ",
    "   1AAAAAA1     ",
    "   1BB  BB1     ",
    "   1BB  BB1     ",
    "   1CC  CC1     ",
    "    11  11      ",
  ];
  const fall = [
    "    111111      ",
    "   15555551     ",
    "  1557775551    ",
    "  15FFF55551    ",
    "  1522275551    ",
    "   12222751     ",
    "   12222751     ",
    "    188881      ",
    "   18999881     ",
    "   18888881     ",
    "   18888881     ",
    "  1188888811    ",
    "  1AAAAAA81     ",
    "  1AAAAAA81     ",
    "  1AAAAAAA1     ",
    "  1AAAAAA1      ",
    "  1BB BB1       ",
    "  1BB BB1       ",
    "  1CC CC1       ",
    "   11 11        ",
  ];
  // crouch / anticipation
  if(state==='crouch') return crouch;
  if(state==='idle'){
    // blink toutes les ~3s pendant 6 frames
    if(frame % 180 < 6) return idleBlink;
    return frame % 40 < 20 ? idle1 : idle2;
  }
  if(state==='jump') return jump;
  if(state==='fall') return fall;
  const frames=[run1,run2,run3,run4,run5,run6];
  return frames[frame % 6];
}
function drawCharacter(x,y, dir, state, frame, squish){
  const grid = getSpriteGrid(state, frame);
  const pxSize = 2;
  const totalW = 16*pxSize;
  const totalH = 20*pxSize;
  // bobbing naturel
  let bob = 0;
  if(state==='idle') bob = Math.sin(frame*0.12)*1.2;
  else if(state==='run') bob = Math.abs(Math.sin(frame*0.9))*2.5;
  else if(state==='crouch') bob = 2;
  const ox = x + (player.w - totalW)/2;
  const oy = y + (player.h - totalH) -2 + squish*4 + bob;
  ctx.save();
  const pivotX = x + player.w/2;
  const pivotY = y + player.h;
  // squash/stretch autour des pieds
  ctx.translate(pivotX, pivotY);
  ctx.scale(1 + squish*0.3, 1 - squish*0.4);
  ctx.translate(-pivotX, -pivotY);
  // flip horizontal propre autour du centre du joueur
  if(dir===1){
    ctx.translate(pivotX, 0);
    ctx.scale(-1, 1);
    ctx.translate(-pivotX, 0);
  }
  drawGrid(ox, oy, grid, pxSize);
  ctx.restore();
}
function drawGrid(ox, oy, grid, s){
  const colorMap = {
    '1': PAL.outline,
    '2': PAL.skin,
    '3': PAL.skinShade,
    '4': PAL.hair,
    '5': PAL.cap,
    '6': PAL.capDark,
    '7': PAL.capLight,
    '8': PAL.shirt,
    '9': PAL.shirtDark,
    'A': PAL.pants,
    'B': PAL.shoe,
    'C': PAL.shoeSole,
    'F': PAL.white,
  };
  for(let row=0; row<grid.length; row++){
    const line = grid[row];
    for(let col=0; col<line.length; col++){
      const ch = line[col];
      if(ch===' ' || ch==='0') continue;
      const colr = colorMap[ch];
      if(!colr) continue;
      ctx.fillStyle=colr;
      ctx.fillRect(Math.round(ox+col*s), Math.round(oy+row*s), s, s);
    }
  }
}
function _unused_drawCoin(c){
  if(c.taken) return;
  const bob = Math.sin(globalTime*0.004 + c.x)*4;
  const x = c.x, y = c.y + bob;
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(x+8, y+20, 10, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFD700';
  ctx.fillRect(x,y,16,16);
  ctx.fillStyle='#FFA500';
  ctx.fillRect(x,y+12,16,4);
  ctx.fillRect(x+12,y,4,16);
  ctx.fillStyle='#FFF7AA';
  ctx.fillRect(x+2,y+2,4,4);
  ctx.fillRect(x+10,y+6,2,6);
  ctx.fillStyle=PAL.outline;
  ctx.fillRect(x,y,16,1);
  ctx.fillRect(x,y+15,16,1);
  ctx.fillRect(x,y,1,16);
  ctx.fillRect(x+15,y,1,16);
  ctx.fillStyle='#fff';
  ctx.fillRect(x+4,y+4,2,2);
}

let wasOnGround=false;
function update(){
  globalTime+=16;
  const left = isDown('ArrowLeft','KeyA');
  const right = isDown('ArrowRight','KeyD');
  const jumpPressed = isDown('Space','ArrowUp','KeyW');
  let input = 0;
  if(left) input -=1;
  if(right) input +=1;
  if(input!==0) player.dir = input;
  if(input!==0){
    player.vx += input * ACCEL * 1.2;
    if(Math.abs(player.vx) > SPEED) player.vx = Math.sign(player.vx)*SPEED;
  } else {
    player.vx *= FRICTION;
    if(Math.abs(player.vx)<0.1) player.vx=0;
  }
  if(jumpPressed) player.jumpBuffer=6; else if(player.jumpBuffer>0) player.jumpBuffer--;
  if(player.onGround) {player.coyote=6; player.jumps=2; } else if(player.coyote>0) player.coyote--;
  const justPressed = jumpPressed && !player.wasSpace;
  if(justPressed && (player.coyote>0 || player.jumpBuffer>0 || player.jumps>0)){
    const isDouble = !player.onGround && player.coyote===0;
    if(isDouble){
      if(player.jumps>0){
        player.vy = DOUBLE_JUMP_VEL;
        player.jumps--;
        player.coyote=0;
        player.jumpBuffer=0;
        player.squish = -0.8;
        cameraShake=6;
        spawnDoubleJumpRing(player.x+player.w/2, player.y+player.h/2);
        spawnParticles(player.x+player.w/2, player.y+player.h, 6, {color:'#7AB0FF', gravity:0.1})
      }
    } else {
      player.vy = JUMP_VEL;
      player.coyote=0;
      player.jumpBuffer=0;
      player.jumps=1;
      player.squish = -0.9;
      spawnDust(player.x+player.w/2, player.y+player.h);
      if(player.onGround) player.jumps=1;
    }
    player.onGround=false;
  }
  if(!jumpPressed && player.vy < -4) player.vy *= 0.88;
  player.wasSpace = jumpPressed;
  player.vy += GRAVITY;
  if(player.vy>14) player.vy=14;
  // --- déplacement X libre dans le monde ---
  let nextX = player.x + player.vx;
  // limites monde
  if(nextX < 0){ nextX=0; player.vx=0; }
  if(nextX + player.w > WORLD_W){ nextX = WORLD_W - player.w; player.vx=0; }
  player.x = nextX;

  // --- collision sol vallonné ---
  let nextY = player.y + player.vy;
  player.onGround=false;
  const footX = player.x + player.w/2;
  const groundY = getGroundHeight(footX);
  if(nextY + player.h >= groundY){
    if(player.vy >= 0){
      // atterrissage
      if(!wasOnGround){
        if(player.vy>6){
          cameraShake = Math.min(10, player.vy);
          spawnDust(player.x+player.w/2, groundY);
          spawnParticles(player.x+player.w/2, groundY, 4, {color:'#C47A3A'});
          player.squish=0.9;
          player.landTimer=10;
        } else if(player.vy>2){
          spawnDust(player.x+player.w/2, groundY);
          player.squish=0.5;
          player.landTimer=6;
        }
      }
      nextY = groundY - player.h;
      player.vy=0;
      player.onGround=true;
      player.jumps=2;
    }
  }
  // plafond invisible
  if(nextY < -100){ nextY=-100; player.vy=0; }
  player.y = nextY;

  if(player.y > H+120){
    // chute dans le vide (si tombe hors sol, rare)
    player.y=100; player.x=Math.max(60, player.x-80); player.vy=0; player.vx=0;
    cameraShake=12;
    spawnParticles(player.x+player.w/2, player.y+player.h, 16, {color:'#FF1B5A', spreadX:10, vy:-4})
  }
  // caméra suit le joueur
  const targetCam = Math.max(0, Math.min(player.x - W/2 + player.w/2, WORLD_W - W));
  camX += (targetCam - camX)*0.12;
  wasOnGround = player.onGround;
  if(player.landTimer>0) player.landTimer--;
  // skid quand on change de direction vite
  if(player.onGround && Math.abs(player.vx)>3 && Math.sign(input)!==0 && Math.sign(input)!==Math.sign(player.vx)){
    player.skidTimer=6;
    if(Math.random()<0.3) spawnDust(player.x+player.w/2, player.y+player.h);
  }
  if(player.skidTimer>0) player.skidTimer--;
  player.squish *= 0.82;
  if(Math.abs(player.squish)<0.01) player.squish=0;
  // anim
  if(!player.onGround) player.animT+=0.9;
  else if(Math.abs(player.vx)>0.5) player.animT+=0.65;
  else player.animT+=0.35;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=p.gravity;
    p.vx*=0.98;
    p.life-=p.decay;
    if(p.life<=0) particles.splice(i,1);
  }
  if(cameraShake>0) cameraShake*=0.85;
  if(cameraShake<0.1) cameraShake=0;
}

// --- PARALLAXE ---
const parallax = {
  clouds: [
    {x:120, y:80, s:1},
    {x:380, y:60, s:1.2},
    {x:650, y:100, s:0.9},
    {x:820, y:70, s:1.1},
    {x:200, y:130, s:0.8},
  ],
  drift: 0
};
function drawCloud(px,py,scale){
  ctx.fillStyle='rgba(0,0,0,0.08)';
  ctx.beginPath();
  ctx.ellipse(px+3,py+5, 26*scale, 12*scale,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(px, py, 16*scale,0,Math.PI*2);
  ctx.arc(px+18*scale, py+5*scale, 14*scale,0,Math.PI*2);
  ctx.arc(px-16*scale, py+6*scale, 12*scale,0,Math.PI*2);
  ctx.arc(px+7*scale, py-9*scale, 11*scale,0,Math.PI*2);
  ctx.fill();
}
function drawParallax(){
  // utilise camX pour cohérence avec défilement
  const cam = camX;
  // 1. Montagnes lointaines (très lent)
  const mx = cam * 0.08;
  ctx.fillStyle='#6C5B7B';
  ctx.beginPath();
  ctx.moveTo(-200 - mx*0.5, 320);
  ctx.lineTo(80 - mx*0.3, 220);
  ctx.lineTo(200 - mx*0.3, 260);
  ctx.lineTo(360 - mx*0.4, 190);
  ctx.lineTo(520 - mx*0.3, 250);
  ctx.lineTo(700 - mx*0.5, 200);
  ctx.lineTo(860 - mx*0.4, 240);
  ctx.lineTo(1160 - mx*0.3, 210);
  ctx.lineTo(1160, 360);
  ctx.lineTo(-200, 360);
  ctx.closePath(); ctx.fill();
  // neige sur montagnes
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.moveTo(80 - mx*0.3, 220);
  ctx.lineTo(95 - mx*0.3, 240);
  ctx.lineTo(65 - mx*0.3, 240); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(360 - mx*0.4, 190);
  ctx.lineTo(380 - mx*0.4, 215);
  ctx.lineTo(340 - mx*0.4, 215); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(700 - mx*0.5, 200);
  ctx.lineTo(715 - mx*0.5, 225);
  ctx.lineTo(685 - mx*0.5, 225); ctx.fill();

  // 2. Collines moyennes (vert foncé)
  const hx1 = cam * 0.18;
  ctx.fillStyle='#5BAE6B';
  ctx.beginPath();
  ctx.moveTo(-300 - hx1, 380);
  ctx.quadraticCurveTo(80 - hx1, 280, 280 - hx1, 360);
  ctx.quadraticCurveTo(480 - hx1, 410, 680 - hx1, 340);
  ctx.quadraticCurveTo(880 - hx1, 300, 1200 - hx1, 370);
  ctx.lineTo(1200 - hx1, 480); ctx.lineTo(-300 - hx1, 480); ctx.closePath(); ctx.fill();

  // 3. Collines proches (vert clair)
  const hx2 = cam * 0.32;
  ctx.fillStyle='#7ED190';
  ctx.beginPath();
  ctx.moveTo(-300 - hx2, 420);
  ctx.quadraticCurveTo(100 - hx2, 340, 300 - hx2, 400);
  ctx.quadraticCurveTo(520 - hx2, 450, 740 - hx2, 380);
  ctx.quadraticCurveTo(900 - hx2, 350, 1220 - hx2, 410);
  ctx.lineTo(1220 - hx2, 480); ctx.lineTo(-300 - hx2, 480); ctx.closePath(); ctx.fill();
  // reflets collines proches
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.ellipse(120 - hx2, 380, 50, 18, 0,0,Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(620 - hx2, 390, 70, 22, 0,0,Math.PI*2); ctx.fill();

  // 4. Nuages qui dérivent + parallaxe
  parallax.drift += 0.15 + Math.abs(player.vx)*0.02;
  for(const cl of parallax.clouds){
    let cx = (cl.x - cam*0.12 + parallax.drift*cl.s) % (W+400) -200;
    // wrap
    if(cx < -200) cx += W+400;
    if(cx > W+200) cx -= W+400;
    // léger flottement vertical lié au temps
    const fy = cl.y + Math.sin(globalTime*0.001 + cl.x)*2;
    drawCloud(cx, fy, cl.s);
  }

  // 5. Soleil lointain (très lent)
  const sx = 800 - cam*0.05;
  const sy = 90 + Math.sin(globalTime*0.0005)*3;
  ctx.fillStyle='#FFE600';
  ctx.beginPath(); ctx.arc(sx, sy, 28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFF7AA';
  ctx.beginPath(); ctx.arc(sx, sy, 16,0,Math.PI*2); ctx.fill();
}

function render(){
  ctx.save();
  if(cameraShake>0) ctx.translate((Math.random()-0.5)*cameraShake, (Math.random()-0.5)*cameraShake);
  ctx.fillStyle=PAL.sky;
  ctx.fillRect(0,0,W,H);
  drawParallax();
  // --- sol défilant amélioré ---
  ctx.save();
  // pas de translate global, drawScrollingGround gère camX
  drawScrollingGround(camX);
  ctx.restore();
  // --- joueur et effets en coordonnées monde -> écran ---
  let state='idle', frame=Math.floor(player.animT);
  if(!player.onGround){
    state = player.vy<0 ? 'jump' : 'fall';
    frame = Math.floor(player.animT);
  } else {
    if(player.landTimer>0){
      state='crouch';
      frame = Math.floor(player.animT);
    } else if(Math.abs(player.vx)>0.5){
      state='run';
      frame = Math.floor(player.animT / 5.2);
    } else {
      state='idle';
      frame = Math.floor(player.animT);
    }
  }
  // world to screen
  const sx = player.x - camX;
  const sy = player.y;
  if(Math.abs(player.vx)>3 || !player.onGround){
    ctx.globalAlpha=0.15;
    drawCharacter(sx - player.vx*1.2, sy - player.vy*0.5, player.dir, state, frame, player.squish);
    ctx.globalAlpha=1;
  }
  // ombre projetée sur sol vallonné
  ctx.fillStyle='rgba(0,0,0,0.18)';
  const groundY = getGroundHeight(player.x + player.w/2);
  const dist = groundY - (player.y+player.h);
  const shadowScale = Math.max(0, 1 - dist/140);
  ctx.beginPath();
  ctx.ellipse(sx+player.w/2, groundY, 14*shadowScale+4, 4*shadowScale+2, 0,0,Math.PI*2);
  ctx.fill();
  drawCharacter(sx, sy, player.dir, state, frame, player.squish);
  for(const p of particles){
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle=p.color;
    const px = p.x - camX;
    if(p.type==='circle'){
      ctx.beginPath(); ctx.arc(px,p.y,p.size,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillRect(px,p.y,p.size,p.size);
    }
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function loop(){
  if(!rouletteDone) { render(); requestAnimationFrame(loop); return; }
  update();
  render();
  requestAnimationFrame(loop);
}
// --- ROULETTE ---
let rouletteDone = false;
let isSpinning = false;
const segments = [100, 250, 400, 550, 700, 850, 900, 1000];
const segColors = ['#FF1B5A','#3A86FF','#2ECC71','#FFE600','#FF8C00','#9B59B6','#1ABC9C','#E74C3C'];
const wheelEl = document.getElementById('wheel');
const wheelCanvas = document.getElementById('wheelCanvas');
const wctx = wheelCanvas.getContext('2d');
const spinBtn = document.getElementById('spinBtn');
const winText = document.getElementById('winText');
const overlay = document.getElementById('rouletteOverlay');
let currentRotation = 0;

function drawRoulette(){
  const cx=140, cy=140, r=140;
  const n=segments.length;
  wctx.clearRect(0,0,280,280);
  for(let i=0;i<n;i++){
    const start = (i/n)*Math.PI*2 - Math.PI/2;
    const end = ((i+1)/n)*Math.PI*2 - Math.PI/2;
    wctx.beginPath();
    wctx.moveTo(cx,cy);
    wctx.arc(cx,cy,r,start,end);
    wctx.closePath();
    wctx.fillStyle=segColors[i];
    wctx.fill();
    wctx.strokeStyle='#1A102E';
    wctx.lineWidth=3;
    wctx.stroke();
    // texte
    wctx.save();
    wctx.translate(cx,cy);
    const mid = (start+end)/2;
    wctx.rotate(mid + Math.PI/2);
    wctx.textAlign='center';
    wctx.fillStyle='#fff';
    wctx.font='900 14px monospace';
    wctx.strokeStyle='#1A102E';
    wctx.lineWidth=3;
    const txt = segments[i]+'$';
    wctx.strokeText(txt, 0, -95);
    wctx.fillText(txt, 0, -95);
    wctx.restore();
  }
  // center circle
  wctx.beginPath();
  wctx.arc(cx,cy,26,0,Math.PI*2);
  wctx.fillStyle='#fff';
  wctx.fill();
  wctx.strokeStyle='#1A102E';
  wctx.lineWidth=4;
  wctx.stroke();
}
drawRoulette();

function spinRoulette(){
  if(isSpinning) return;
  isSpinning=true;
  spinBtn.disabled=true;
  winText.textContent='';
  winText.style.color='#fff';
  winText.textContent='...';
  const spins = 5 + Math.random()*3; // 5-8 tours
  const segAngle = 360/segments.length;
  // rotation aléatoire totale, puis on détermine le gagnant VISUELLEMENT
  const randomAngle = Math.random()*360;
  const target = spins*360 + randomAngle;
  currentRotation += target;
  wheelEl.style.transform = `rotate(${currentRotation}deg)`;
  setTimeout(()=>{
    // calcul du segment réellement sous le pointeur (top = 270°)
    const normalized = ((currentRotation % 360)+360)%360;
    const theta0 = ((270 - normalized)+360)%360; // angle d'origine qui est maintenant en haut
    const idx = Math.floor(((theta0 + 90)%360 / segAngle)) % segments.length;
    const win = segments[idx];
    player.money += win;
    updateHUD();
    winText.style.color='#2ECC71';
    winText.textContent = `+${win}$ !`;
    // confetti
    for(let i=0;i<30;i++){
      particles.push({
        x: W/2 + (Math.random()-0.5)*200,
        y: H/2 -80,
        vx:(Math.random()-0.5)*8,
        vy:-Math.random()*6 -2,
        life:1, decay:0.03+Math.random()*0.04, size:3+Math.random()*4,
        color: segColors[Math.floor(Math.random()*segColors.length)],
        gravity:0.3, type: Math.random()<0.5?'square':'circle'
      });
    }
    setTimeout(()=>{
      winText.textContent = `Tu commences avec ${player.money}$ !`;
      spinBtn.textContent = 'JOUER ▶';
      spinBtn.disabled=false;
      isSpinning=false;
      spinBtn.onclick = ()=>{
        overlay.style.transition='opacity 0.4s';
        overlay.style.opacity='0';
        setTimeout(()=>{ overlay.style.display='none'; rouletteDone=true; },400);
      };
    },900);
  },4200);
}
spinBtn.onclick = spinRoulette;

loop();
